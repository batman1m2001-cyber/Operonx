[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operonx"
version = "0.6.0"
description = "High-performance workflow engine for AI applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Operon Team" }]
keywords = ["workflow", "orchestration", "async", "dag", "pipeline", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "orjson>=3.9",
    # Provider plumbing kept in base because the LLM type system
    # (openai.types.chat.*) is used as the canonical message format
    # across every provider — trying to optionalize it forced a maze
    # of transitive extras. These three are small (~10MB combined)
    # and almost every Operonx program touches at least one of them.
    "openai>=1.0",
    "aiohttp>=3.8",
    "httpx>=0.24",
]

# Optional dependency extras. Each extra is **self-contained** — listing
# every package it needs, including any that other extras also use.
# Installing one extra cannot rely on another being present.
#
#   pip install operonx[anthropic]    # Anthropic provider (httpx + openai types)
#   pip install operonx[gemini]       # Gemini provider
#   pip install operonx[bedrock]      # AWS Bedrock provider
#   pip install operonx[onnx]         # Local ONNX embedding/reranker
#   pip install operonx[huggingface]  # Local HF embedding/reranker
#   pip install operonx[langfuse]     # Langfuse tracing
#   pip install operonx[otel]         # OpenTelemetry tracing
#   pip install operonx[serve]        # FastAPI HTTP server
#   pip install operonx[providers]    # All HTTP-based LLM/embedding providers
#   pip install operonx[standard]     # providers + langfuse + otel + serve
#   pip install operonx[all]          # Everything except heavy ML deps (huggingface)
[project.optional-dependencies]
# HTTP-based LLM + embedding providers (OpenAI, Azure, Anthropic, vLLM,
# TEI, Pinecone). Bundle of shared deps; importable as a one-shot install.
providers = [
    "openai>=1.0",        # canonical ChatCompletion types (used by every LLM backend)
    "aiohttp>=3.8",       # vLLM/TEI/Pinecone HTTP clients
    "numpy>=2.2.6",       # vLLM embedding output type
    "httpx>=0.24",        # Anthropic direct API client
]
anthropic = [
    "openai>=1.0",        # ChatCompletion types
    "httpx>=0.24",        # direct API client (we don't use the anthropic SDK)
]
gemini = [
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
    "openai>=1.0",        # AsyncOpenAI client + types
]
bedrock = [
    "boto3>=1.28",
    "openai>=1.0",        # ChatCompletion types
]
onnx = [
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
    "numpy>=2.2.6",
]
huggingface = [
    "transformers>=4.30",
    "torch>=2.0",
    "numpy>=2.2.6",
]
langfuse = [
    "langfuse>=2.6.0,<3.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
# Production bundle — everything except heavy local-ML deps. This is what
# most users want.
standard = [
    "openai>=1.0",
    "aiohttp>=3.8",
    "numpy>=2.2.6",
    "httpx>=0.24",
    "langfuse>=2.6.0,<3.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
# Everything: standard + every provider extra (Anthropic, Gemini, Bedrock,
# ONNX). Skips `huggingface` because torch is a 2GB download — opt in
# explicitly when you need it.
all = [
    "openai>=1.0",
    "aiohttp>=3.8",
    "numpy>=2.2.6",
    "httpx>=0.24",
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
    "boto3>=1.28",
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
    "langfuse>=2.6.0,<3.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.24",
    "ruff>=0.1",
    "pre-commit",
]

[project.scripts]
operonx = "operonx.cli:main"

[project.urls]
Homepage = "https://github.com/batman1m2001-cyber/Operon"
Documentation = "https://github.com/batman1m2001-cyber/Operon#readme"
Repository = "https://github.com/batman1m2001-cyber/Operon"

[tool.hatch.build.targets.wheel]
packages = ["operonx"]

[tool.hatch.build.targets.sdist]
include = ["/operonx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
extend-ignore = [
    # Comparison to True/False — intentional for clarity in some cases.
    "E712",
    # Unused imports — intentional in __init__.py re-exports.
    "F401",
    # f-string without placeholders — adjacent literals stay visually
    # consistent even when the current one has no interpolation.
    "F541",
    # Line too long — enforced by ruff format, not the linter.
    "E501",
    # Module-level import not at top — needed for the `sys.path.insert` +
    # late-import pattern used by example demo scripts.
    "E402",
    # `type(x) == X` — intentional where `isinstance` would be wrong
    # (subclass-sensitive hot paths).
    "E721",
    # Bare except — sparingly used in best-effort cleanup paths.
    "E722",
    # Lambda assignment — readability call.
    "E731",
    # Unused local variable — used in tests for assert clarity.
    "F841",
]

[tool.ruff.lint.isort]
known-first-party = ["operonx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "unit: marks a provider test as a fast mock-only unit test (opts out of the default integration auto-mark in tests/internal/providers/conftest.py)",
]
