[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operonx"
version = "0.6.0"
description = "High-performance workflow engine for AI applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Operon Team" }]
keywords = ["workflow", "orchestration", "async", "dag", "pipeline", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
providers = [
    "openai>=1.0",
    "aiohttp>=3.8",
    "numpy>=2.2.6",
]
gemini = [
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
]
bedrock = [
    "boto3>=1.28",
]
anthropic = [
    "anthropic>=0.45.0",
]
onnx = [
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
]
huggingface = [
    "transformers>=4.30",
    "torch>=2.0",
]
langfuse = [
    "langfuse>=2.6.0,<3.0.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
all = [
    "operonx[providers,langfuse,otel,serve]",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.24",
    "ruff>=0.1",
    "pre-commit",
]

[project.scripts]
operonx = "operonx.cli:main"

[project.urls]
Homepage = "https://github.com/batman1m2001-cyber/Operon"
Documentation = "https://github.com/batman1m2001-cyber/Operon#readme"
Repository = "https://github.com/batman1m2001-cyber/Operon"

[tool.hatch.build.targets.wheel]
packages = ["operonx"]

[tool.hatch.build.targets.sdist]
include = ["/operonx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
extend-ignore = [
    "E712",
    "F401",
    "F541",
]

[tool.ruff.lint.isort]
known-first-party = ["operonx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
]
