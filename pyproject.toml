[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operonx"
version = "1.1.0"
description = "High-performance workflow engine for AI applications"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Operon Team" }]
keywords = ["workflow", "orchestration", "async", "dag", "pipeline", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "orjson>=3.9",
]

# Optional dependency extras. Each extra is **self-contained** — listing
# every package it needs, including any that other extras also use.
# Installing one extra cannot rely on another being present.
#
# Install tiers:
#
#   Tier 1 — engine only (no providers):
#     pip install operonx
#
#   Tier 2 — single provider:
#     pip install operonx[openai]      # OpenAI / Azure OpenAI
#     pip install operonx[anthropic]   # Anthropic
#     pip install operonx[gemini]      # Google Gemini (Vertex AI)
#     pip install operonx[bedrock]     # AWS Bedrock
#
#   Tier 3 — feature extras (additive on top of tier 1 or 2):
#     pip install operonx[langfuse]    # Langfuse tracing
#     pip install operonx[serve]       # FastAPI HTTP server
#     pip install operonx[onnx]        # Local ONNX embedding/reranker
#     pip install operonx[huggingface] # Local HF embedding/reranker
#
#   Tier 4 — meta bundles:
#     pip install operonx[providers]   # All HTTP-based LLM/embedding providers
#     pip install operonx[standard]    # providers + langfuse + serve
#     pip install operonx[all]         # everything except torch/HF
[project.optional-dependencies]
# Single-provider extras — each pins only the SDK that provider needs.
openai = [
    "openai>=1.0",
]
anthropic = [
    "openai>=1.0",        # ChatCompletion types (canonical message format)
    "httpx>=0.24",        # direct API client (we don't use the anthropic SDK)
]
gemini = [
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
    "openai>=1.0",        # AsyncOpenAI client + types
]
bedrock = [
    "boto3>=1.28",
    "openai>=1.0",        # ChatCompletion types
]
onnx = [
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
    "numpy>=2.2.6",
]
huggingface = [
    "transformers>=4.30",
    "torch>=2.0",
    "numpy>=2.2.6",
]
faiss = [
    "faiss-cpu>=1.8",
    "numpy>=2.2.6",
]
pgvector = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
qdrant = [
    "qdrant-client>=1.9",
]
langfuse = [
    "langfuse>=2.6.0,<3.0.0",
]
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
# Production bundle — everything except heavy local-ML deps. This is what
# most users want.
standard = [
    "openai>=1.0",
    "aiohttp>=3.8",
    "numpy>=2.2.6",
    "httpx>=0.24",
    "langfuse>=2.6.0,<3.0.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
# Everything: standard + every provider extra (Anthropic, Gemini, Bedrock,
# ONNX). Skips `huggingface` because torch is a 2GB download — opt in
# explicitly when you need it.
all = [
    "openai>=1.0",
    "aiohttp>=3.8",
    "numpy>=2.2.6",
    "httpx>=0.24",
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
    "boto3>=1.28",
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
    "faiss-cpu>=1.8",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "qdrant-client>=1.9",
    "langfuse>=2.6.0,<3.0.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.24",
    "ruff>=0.1",
    "pre-commit",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
operonx = "operonx.cli:main"
operonx-pack = "operonx.tools.pack:main"

[project.urls]
Homepage = "https://github.com/batman1m2001-cyber/Operonx"
Documentation = "https://batman1m2001-cyber.github.io/Operonx/"
Repository = "https://github.com/batman1m2001-cyber/Operonx"
Changelog = "https://github.com/batman1m2001-cyber/Operonx/blob/main/CHANGELOG.md"
Issues = "https://github.com/batman1m2001-cyber/Operonx/issues"

[tool.hatch.build.targets.wheel]
packages = ["operonx"]

[tool.hatch.build.targets.sdist]
include = ["/operonx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
extend-ignore = [
    # Comparison to True/False — intentional for clarity in some cases.
    "E712",
    # Unused imports — intentional in __init__.py re-exports.
    "F401",
    # f-string without placeholders — adjacent literals stay visually
    # consistent even when the current one has no interpolation.
    "F541",
    # Line too long — enforced by ruff format, not the linter.
    "E501",
    # Module-level import not at top — needed for the `sys.path.insert` +
    # late-import pattern used by example demo scripts.
    "E402",
    # `type(x) == X` — intentional where `isinstance` would be wrong
    # (subclass-sensitive hot paths).
    "E721",
    # Bare except — sparingly used in best-effort cleanup paths.
    "E722",
    # Lambda assignment — readability call.
    "E731",
    # Unused local variable — used in tests for assert clarity.
    "F841",
]

[tool.ruff.lint.isort]
known-first-party = ["operonx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "unit: marks a provider test as a fast mock-only unit test (opts out of the default integration auto-mark in tests/internal/providers/conftest.py)",
]
