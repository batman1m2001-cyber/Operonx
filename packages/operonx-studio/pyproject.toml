[project]
name = "operonx-studio"
version = "0.1.0"
description = "Visual workspace for operonx projects — graph view, resources, env"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bruce Win", email = "batman1m2001@gmail.com" }]
keywords = ["operonx", "workflow", "visualization", "ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# The static renderer needs nothing but the toolkit. The local daemon lands
# with the write path and brings the web stack with it as an extra, so
# generating a graph view never pulls a server.
dependencies = [
    "operonx-project>=0.1.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]

# operonx-project is developed alongside operonx in this repo rather than
# resolved from an index.
[tool.uv.sources]
operonx-project = { path = "../operonx-project" }

[project.scripts]
operonx-studio = "operonx_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operonx_studio"]

[tool.pytest.ini_options]
markers = ["unit: fast, no network"]
