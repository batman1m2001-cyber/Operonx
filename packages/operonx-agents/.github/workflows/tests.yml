name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      # operonx is a path dependency on ../Operon: check both out side by side
      - uses: actions/checkout@v4
        with:
          path: operonx-agents
      - uses: actions/checkout@v4
        with:
          repository: batman1m2001-cyber/Operonx
          path: Operon
      - uses: astral-sh/setup-uv@v5
      - name: sync
        working-directory: operonx-agents
        run: uv sync --all-extras
      - name: lint
        working-directory: operonx-agents
        run: uv run ruff check . && uv run ruff format --check .
      - name: offline tests and the 20-case eval
        working-directory: operonx-agents
        run: uv run pytest -m "not live" -q
      - name: the 20-case support eval (one experiment, gated)
        working-directory: operonx-agents
        run: >
          PYTHONPATH=. uv run pytest evals -q -p operonx.app.evals.pytest_plugin
          --operonx-eval-name support --operonx-eval-dir ${{ runner.temp }}/evals
