[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operonx-kb"
version = "0.2.4"
description = "Knowledge base and document intelligence on OperonX: versioned documents with span-level provenance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Core: text, Markdown, HTML, DOCX/PPTX/XLSX (stdlib), SQLite catalog, local
# blobs, in-memory index. Everything heavier is an extra (PLAN.md §1).
dependencies = [
    "operonx>=1.17",
    "pydantic>=2.0",
    "defusedxml>=0.7.1",  # Office XML from untrusted files
    "httpx>=0.24",        # operonx.providers (EmbeddingOp) imports it eagerly
    "numpy>=1.24",        # the concept graph walk (retrieval/graph.py), imported by the graphs
]

[project.optional-dependencies]
# PDF text layer with coordinates: docling-parse (MIT, C++), behind PdfBackend.
pdf = ["docling-parse>=7.22"]
# ML layout + TableFormer (docling-ibm-models, MIT, torch). Off by default; phase K1b.
layout = ["docling-ibm-models[opencv-python-headless]>=4.0", "docling-parse>=7.22", "pypdfium2>=4.30", "torch>=2.2.2", "torchvision"]
# Postgres catalog (phase K1c).
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
# Answers with citations (LLMOp): operonx's OpenAI-compatible providers.
answer = ["operonx[openai]"]
# The admin API Studio's Knowledge tab talks to (operonx_kb.admin): Starlette, as
# operonx's own serve layer mounts it, and page images rendered with pypdfium2.
admin = ["operonx[serve]", "pypdfium2>=4.30", "pillow>=10"]
all = ["operonx-kb[pdf,postgres,faiss,answer,admin]"]
# The KB over MCP (operonx_kb.mcp, `operonx-kb mcp`): for clients outside our code.
mcp = ["mcp>=2.0"]
# Ingest from object storage and Google Drive (operonx_kb.sources).
s3 = ["boto3>=1.28"]
drive = ["google-api-python-client>=2.100", "google-auth>=2.20"]
# OCR for scanned PDF pages (CollectionSpec.ocr): page rendering. The engine is the
# `tesseract` binary with its language data, a system package (apt install
# tesseract-ocr tesseract-ocr-vie), not a Python dependency.
ocr = ["operonx-kb[pdf]", "pypdfium2>=4.30", "pillow>=10"]
# The benchmarks' embedder (scripts/bench_*.py: multilingual-e5 through operonx's HF
# backend), on CPU-only torch (see [tool.uv.sources]).
bench = ["operonx[huggingface]", "torch>=2.2.2", "operonx-kb[faiss]"]

# Dense index backends: operonx's vector stores.
faiss = ["operonx[faiss]"]
pgvector = ["operonx[pgvector]"]
qdrant = ["operonx[qdrant]"]

[project.scripts]
operonx-kb = "operonx_kb.cli:main"

# operonx finds the KB's resource categories without importing the package
# (the entry point's name is the category).
[project.entry-points."operonx.resources"]
kb_catalog = "operonx_kb.registry:register_catalog"
kb_blob = "operonx_kb.registry:register_blob"
kb_lexical = "operonx_kb.registry:register_lexical"
fake_embedding = "operonx_kb.testing.fakes:register_fakes"
fake_reranking = "operonx_kb.testing.fakes:register_fakes"
fake_llm = "operonx_kb.testing.fakes:register_fakes"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "reportlab>=4.0",  # generates the golden PDFs (tests/golden/make_pdfs.py)
    "ruff>=0.6",
    "faiss-cpu>=1.15.1",
    "numpy>=2.2.6",
    "openai>=1.0",  # LLMOp's message types (the ScriptedLLM fake)
    "starlette>=0.27",  # the admin API (tests/admin)
    "pypdfium2>=4.30",  # page images (tests/admin)
    "pillow>=10",
    "operonx-agents",  # kb_tools on a real Agent (tests/graphs/test_agent_tools.py)
    "mcp>=2.0",  # the KB over MCP (tests/graphs/test_mcp.py)
]

[tool.uv.sources]
# Editable from this repo's own operonx (the package lives in packages/).
operonx = { path = "../..", editable = true }
# Not editable: an editable install puts the agents checkout on sys.path, and its
# `tests` package would shadow this one.
operonx-agents = { path = "../operonx-agents", editable = false }
# CPU-only torch for the `layout` extra: the default PyPI wheel pulls ~3 GB of CUDA.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["operonx_kb"]

# The source archive is the package, not the repo: no docs/, datasets/ or scripts/.
[tool.hatch.build.targets.sdist]
include = ["operonx_kb", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The scale gates and the slow ones run with `-m corpus`, `-m slow`, or
# everything with `-m ""`; a plain `pytest` stays quick.
addopts = "-m 'not corpus and not slow'"
markers = [
    "slow: correct but seconds-long (subprocesses, OCR, real sleeps)",
    "pdf: needs the 'pdf' extra (docling-parse)",
    "corpus: the 200-document and 100-page scale gates (about a minute)",
]
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
