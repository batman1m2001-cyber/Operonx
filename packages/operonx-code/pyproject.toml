[project]
name = "operonx-code"
version = "0.1.0"
description = "A reference coding agent built on operonx.agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bruce Win", email = "batman1m2001@gmail.com" }]
keywords = ["agent", "coding-agent", "operonx", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "operonx[standard]>=1.0.0",
]

[project.optional-dependencies]
web = ["httpx>=0.27"]

[project.scripts]
operonx-code = "operonx_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operonx_code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["unit: fast, no network", "integration: needs a live LLM"]
