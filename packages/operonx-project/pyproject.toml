[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operonx-project"
version = "0.1.0"
description = "A project's requirements and where it stands: a living BRD with a checklist, plan docs with a status block, one status document over both"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Operon Team" }]
dependencies = [
    # 1.32.0: the BRD template (operonx.cli.init.brd_files); 1.30.0 the
    # journal's park/resume (the extraction's SqliteJournal).
    "operonx>=1.32.0",
    # the BRD's readers (P4): docx/pptx/xlsx/html with the stdlib, PDF text by
    # docling-parse, scanned pages and images by tesseract (a system binary)
    "operonx-kb[ocr]>=0.2.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
operonx-project = "operonx_project.cli:main"

[project.entry-points."operonx.guides"]
project = "operonx_project.guide"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.uv.sources]
# Editable from this repo's own operonx (the package lives in packages/).
operonx = { path = "../..", editable = true }
operonx-kb = { path = "../operonx-kb", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["operonx_project"]

[tool.hatch.build.targets.sdist]
include = ["operonx_project", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Paid tests (a real Claude Code session) run with `-m paid`.
addopts = "-m 'not paid and not slow'"
markers = [
    "slow: correct but seconds-long (subprocesses, real sleeps)",
    "paid: runs a real coding agent (Claude Code); spends quota",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
