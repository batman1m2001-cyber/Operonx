[project]
name = "operonx-project"
version = "0.1.0"
description = "Project conventions, manifest, and graph extraction for operonx"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bruce Win", email = "batman1m2001@gmail.com" }]
keywords = ["operonx", "workflow", "lint", "tooling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Deliberately minimal. This package runs INSIDE a target project's own
# environment in order to import that project's code, so it must impose
# nothing. AST work is stdlib; tomllib is stdlib on 3.11+.
dependencies = [
    "operonx>=1.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
operonx-lint = "operonx_project.cli:main"
operonx-extract = "operonx_project.cli:extract_main"
operonx-new = "operonx_project.cli:new_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operonx_project"]

[tool.pytest.ini_options]
markers = ["unit: fast, no network"]
