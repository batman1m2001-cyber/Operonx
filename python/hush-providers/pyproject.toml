[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush-providers"
version = "0.1.7"
description = "Hush workflow LLM, embedding, and reranking providers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Hush Team" }
]
keywords = ["llm", "embedding", "reranking", "openai", "azure", "gemini", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "hush-icore>=0.1.7",
    "pydantic>=2.0",
    "openai>=1.0",
    "aiohttp>=3.8",
    "pyyaml>=6.0",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
openai = []  # Already in base dependencies (Azure OpenAI also uses this)
gemini = [
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
]
bedrock = [
    "boto3>=1.28",
]

onnx = [
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
]
huggingface = [
    "transformers>=4.30",
    "torch>=2.0",
]
embeddings = [
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
]
rerankers = [
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
]
all-light = [
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
    "boto3>=1.28",
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
]
all = [
    "google-cloud-aiplatform>=1.38",
    "requests>=2.32",
    "boto3>=1.28",
    "onnxruntime>=1.15,<1.20",
    "tokenizers>=0.13",
    "transformers>=4.30",
    "torch>=2.0",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "python-dotenv>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/batman1m2001-cyber/Hush-ai"
Documentation = "https://github.com/batman1m2001-cyber/Hush-ai#readme"
Repository = "https://github.com/batman1m2001-cyber/Hush-ai"

[tool.hatch.build.targets.wheel]
packages = ["hush"]

[tool.hatch.build.targets.sdist]
include = [
    "/hush",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top (needed for load_dotenv pattern)
    "E721",  # Type comparison (intentional in some cases)
    "E722",  # Bare except
    "E731",  # Lambda assignment
    "F841",  # Unused variable
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
hush-icore = { path = "../hush-icore", editable = true }
