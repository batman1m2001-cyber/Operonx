[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush-serve"
version = "0.1.5"
description = "Auto-generate API servers from Hush workflow graphs"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Hush Team" }]
keywords = ["workflow", "api", "server", "fastapi", "sse", "websocket"]
dependencies = [
    "hush-icore>=0.1.3",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "websockets>=11.0",
]

[project.optional-dependencies]
providers = ["hush-providers>=0.1.3"]
telemetry = ["hush-telemetry>=0.1.3"]
all = ["hush-providers>=0.1.3", "hush-telemetry>=0.1.3"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["hush"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "E721", "E722", "E731", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
hush-icore = { path = "../hush-icore", editable = true }
hush-providers = { path = "../hush-providers", editable = true }
hush-telemetry = { path = "../hush-telemetry", editable = true }
