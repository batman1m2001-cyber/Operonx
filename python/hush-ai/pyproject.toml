[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush-ai"
version = "0.1.8"
description = "Hush AI — high-performance workflow engine for AI applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruce Win", email = "batman1m2001@gmail.com" }]
keywords = ["workflow", "ai", "llm", "agent", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "hush-icore>=0.1.8",
    "hush-providers>=0.1.8",
    "hush-serve>=0.1.8",
    "hush-telemetry>=0.1.8",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
hush = "hush_ai.cli:main"

[project.urls]
Homepage = "https://github.com/batman1m2001-cyber/Hush-ai"
Documentation = "https://batman1m2001-cyber.github.io/Hush-ai/"
Repository = "https://github.com/batman1m2001-cyber/Hush-ai"

[tool.ruff]
line-length = 100
