[package]
name = "rush-serve"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust HTTP server for Hush workflows (Axum + rush-core)"
license = "Apache-2.0"
repository = "https://github.com/batman1m2001-cyber/Hush-ai"

[[bin]]
name = "rush-serve"
path = "src/main.rs"

[dependencies]
rush-core = { path = "../rush-core", version = "0.1.0" }
rush-providers = { path = "../rush-providers", version = "0.1.0" }
rush-telemetry = { path = "../rush-telemetry", version = "0.1.0" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tokio-stream = "0.1"
futures = "0.3"
dashmap = "6"
