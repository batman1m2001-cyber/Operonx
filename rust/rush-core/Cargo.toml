[package]
name = "rush-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust executor for the Hush workflow engine (Rust + Hush = Rush)"
license = "Apache-2.0"
repository = "https://github.com/batman1m2001-cyber/Hush-ai"
autobenches = false

[lib]
name = "rush_core"
crate-type = ["rlib"]

[dependencies]
ahash = "0.8"
smallvec = "1"
rayon = "1.10"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lasso = { version = "0.7", features = ["multi-threaded"] }
chrono = "0.4"
log = "0.4"
rush-providers = { path = "../rush-providers", version = "0.1.0" }

[features]
default = []
onnx = ["rush-providers/onnx"]
