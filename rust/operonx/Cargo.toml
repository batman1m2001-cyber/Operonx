[package]
name                   = "operonx"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "High-performance Rust execution backend for Operon workflows"
# Bundle the shared `Operon/tests/spec/` fixture tree into the published
# crate so `cargo test -p operonx` works post-install. The JSON fixtures
# live at the repo root (`Operon/tests/spec/`) per plan §8.5 — Python and
# Rust both read the same files. Cargo's `include` walks paths relative to
# the crate manifest directory; the `../../tests/spec/**` entry pulls in
# the repo-root tree.
include = [
    "src/**",
    "tests/common/**",
    "tests/spec/**",
    "tests/internal/**",
    "tests/*.rs",
    "../../tests/spec/**",
    "README.md",
    "LICENSE",
]

[dependencies]
operonx-macros               = { version = "0.8.2", path = "../operonx-macros" }
tokio.workspace              = true
tokio-util.workspace         = true
futures.workspace            = true
async-stream.workspace       = true
async-trait.workspace        = true
dashmap.workspace            = true
lasso.workspace              = true
parking_lot.workspace        = true
rayon.workspace              = true
smallvec.workspace           = true
serde.workspace              = true
serde_json.workspace         = true
serde_yaml.workspace         = true
quick-xml.workspace          = true
thiserror.workspace          = true
reqwest.workspace            = true
dotenvy.workspace            = true
tracing.workspace            = true
tracing-subscriber.workspace = true
inventory.workspace          = true
rand.workspace               = true
chrono.workspace             = true
base64.workspace             = true
uuid.workspace               = true
ort                          = { workspace = true, optional = true }
tokenizers                   = { workspace = true, optional = true }
tonic                        = { workspace = true, optional = true }
prost                        = { workspace = true, optional = true }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# Each example under `examples/rust/<name>/` is now an independent crate
# with its own `Cargo.toml` and `src/main.rs`. Run any example with
# `cd examples/rust/<name> && cargo run --release`. The shared workspace
# operonx is patched in via `examples/rust/.cargo/config.toml` so engine
# devs build against unpublished changes.

[features]
default       = ["langfuse", "operonx-eyes"]
langfuse      = []
operonx-eyes   = []
onnx          = ["dep:ort", "dep:tokenizers"]
triton        = ["dep:tonic", "dep:prost"]
# otel: intentionally not listed — deferred to v0.7 per MIGRATION_rust.md §6a

[package.metadata.docs.rs]
all-features = true
