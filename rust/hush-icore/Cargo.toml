[package]
name = "hush-icore"
version = "0.1.2"
edition = "2021"
description = "High-performance Rust execution backend for the Hush workflow engine"
license = "Apache-2.0"
repository = "https://github.com/batman1m2001-cyber/Hush-ai"
autobenches = false

[lib]
name = "hush_icore"
crate-type = ["rlib"]

[dependencies]
ahash = "0.8"
smallvec = "1"
rayon = "1.10"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lasso = { version = "0.7", features = ["multi-threaded"] }
chrono = "0.4"
log = "0.4"
hush-providers = { path = "../hush-providers", version = "0.1.2" }

[features]
default = []
onnx = ["hush-providers/onnx"]
