[package]
name = "hush-serve"
version = "0.1.4"
edition = "2021"
description = "Standalone Rust HTTP server for Hush workflows (Axum)"
license = "Apache-2.0"
repository = "https://github.com/batman1m2001-cyber/Hush-ai"

[lib]
name = "hush_serve"
path = "src/lib.rs"

[[bin]]
name = "hush-serve"
path = "src/main.rs"

[dependencies]
hush-icore = { path = "../hush-icore", version = "0.1.4" }
hush-providers = { path = "../hush-providers", version = "0.1.4" }
hush-telemetry = { path = "../hush-telemetry", version = "0.1.4" }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tokio-stream = "0.1"
futures = "0.3"
dashmap = "6"
libloading = "0.8"
inventory = "0.3"
hush-macros = { path = "../hush-macros", version = "0.1.4" }
