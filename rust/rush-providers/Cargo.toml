[package]
name = "rush-providers"
version = "0.1.0"
edition = "2021"
description = "Provider configs and native op implementations for the Hush workflow engine"
license = "Apache-2.0"
repository = "https://github.com/batman1m2001-cyber/Hush-ai"

[lib]
name = "rush_providers"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
rand = "0.8"
jsonwebtoken = "9"
base64 = "0.22"
ort = { version = "2.0.0-rc.9", features = ["ndarray"], optional = true }
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.20", optional = true }
regex = "1"
serde_yaml = "0.9"
quick-xml = "0.37"

[features]
default = []
onnx = ["ort", "ndarray", "tokenizers"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
