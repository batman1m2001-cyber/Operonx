[package]
name = "hush-telemetry"
version = "0.1.0"
edition = "2021"
description = "Tracing backends for hush-icore (Langfuse, OTEL, HushEyes)"
license = "Apache-2.0"
repository = "https://github.com/batman1m2001-cyber/Hush-ai"

[lib]
name = "hush_telemetry"

[dependencies]
hush-icore = { path = "../hush-icore", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# OTEL (optional)
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "http-proto"], optional = true }

[features]
default = []
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]
