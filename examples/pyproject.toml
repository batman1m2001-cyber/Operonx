[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutorial"
version = "0.1.0"
description = "Tutorials and examples for the Hush workflow engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hush Team" }
]
dependencies = [
    "hush-core>=0.1.0",
    "hush-providers>=0.1.0",
    "hush-serve>=0.1.0",
    "hush-telemetry[all]>=0.1.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
all = [
    "hush-providers[all-light]",
]
full = [
    "hush-providers[all]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ipython>=8.0",
    "jupyter>=1.0",
]

[tool.uv.sources]
# Use local packages for development
hush-core = { path = "../python/hush-core", editable = true }
hush-providers = { path = "../python/hush-providers", editable = true }
hush-serve = { path = "../python/hush-serve", editable = true }
hush-telemetry = { path = "../python/hush-telemetry", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top (needed for load_dotenv pattern)
    "E721",  # Type comparison (intentional in some cases)
    "E722",  # Bare except
    "E731",  # Lambda assignment
    "F841",  # Unused variable
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
