# Operonx project manifest. Declares the graphs a tool can load,
# and where resources come from. See docs/design/UI_PLATFORM_PLAN.md.

[project]
name = "ex05-loops-and-branches"
description = "Operonx generator ops + if_ branching — pure compute."

# ── the front door ──────────────────────────────────────────────────────
# What puts work into this project. `operonx serve` boots it; the studio
# draws it as the entry node feeding the graph.
[[serve]]
kind    = "http"
method  = "POST"
path    = "/run"
graph   = "main:main_flow"
session = "per_request"
description = "The one main flow: payload in at ingress, answer out at egress."


# ── studio ──────────────────────────────────────────────────────────────
# Where the local trace consumer writes runs; the Traces tab reads this.
[studio]
traces = "/tmp/operonx_traces/ex05_loops_and_branches"
