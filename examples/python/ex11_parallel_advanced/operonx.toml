# Operonx project manifest. Declares the graphs a tool can load,
# and where resources come from. See docs/design/UI_PLATFORM_PLAN.md.

[project]
name = "ex11-parallel-advanced"
description = "Operonx fan-out/fan-in, generator iteration, partial failure."

[[graph]]
name  = "fan_out"
entry = "main:fan_out"

[[graph]]
name  = "iteration"
entry = "main:iteration"

[[graph]]
name  = "partial_failure"
entry = "main:partial_failure"

# ── the front door ──────────────────────────────────────────────────────
# What puts work into this project. `operonx-serve` boots it; the studio
# draws it as the entry node feeding the graph.
[[serve]]
kind    = "http"
method  = "POST"
path    = "/run"
graph   = "main:served"
session = "per_request"
description = "One request in, one reply out — the smallest served graph."

