# Operonx project manifest. Declares the graphs a tool can load,
# and where resources come from. See docs/design/UI_PLATFORM_PLAN.md.

[project]
name = "ex07-embeddings-and-rag"
description = "Operonx embeddings + RAG with optional reranker."

[resources]
overlay = "resources.yaml"

[[graph]]
name  = "basic_embedding"
entry = "main:basic_embedding"

[[graph]]
name  = "simple_rag"
entry = "main:simple_rag"

[[graph]]
name  = "rag_with_rerank"
entry = "main:rag_with_rerank"

# ── the front door ──────────────────────────────────────────────────────
# What puts work into this project. `operonx-serve` boots it; the studio
# draws it as the entry node feeding the graph.
[[serve]]
kind    = "http"
method  = "POST"
path    = "/run"
graph   = "main:served"
session = "per_request"
description = "One request in, one reply out — the smallest served graph."

