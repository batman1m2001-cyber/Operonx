# Where the project is, and where its application is declared.
#
# The services and jobs live in main.py — `APP = Application(...)` with
# `Service(...)` and `Job(...)` entries — where a reader sees the graph,
# the door and the source together. This file says what is not code:
# the resources overlay and the graphs nothing serves, kept for lint and
# the studio.

[project]
name = "ex17-jobs"
description = "One graph: served as HTTP, and run over a JSONL file by a Job with a record per run."
app = "main:APP"

[resources]
overlay = "resources.yaml"

[[graph]]
name  = "score_call"
entry = "main:score_call"

[[graph]]
name  = "passthrough"
entry = "main:passthrough"

[[graph]]
name  = "summarise_flow"
entry = "main:summarise_flow"

[studio]
traces = "/tmp/operonx_traces/ex17_jobs"
