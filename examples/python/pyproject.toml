[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operonx-examples-python"
version = "0.6.0"
description = "Python-side usage examples for Operon."
readme = "../README.md"
requires-python = ">=3.10"
authors = [{ name = "Operon Team" }]

dependencies = [
    "operonx",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
operonx = { path = "../..", editable = true }
