# Pre-commit hooks for Operonx
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(operonx|tests|examples/python)/
      - id: ruff-format
        files: ^(operonx|tests|examples/python)/
