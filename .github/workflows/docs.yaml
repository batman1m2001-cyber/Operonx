name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/**, operonx/**, mkdocs.yml]
  pull_request:
    branches: [main]
    paths: [docs/**, operonx/**, mkdocs.yml]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      # Skip the rest of this job until docs/ scaffolding lands. Once
      # mkdocs.yml exists, the workflow becomes a real strict-mode build.
      - name: Detect mkdocs config
        id: detect
        run: |
          if [ -f mkdocs.yml ]; then
            echo "has_mkdocs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mkdocs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mkdocs.yml not found — docs build skipped (waiting on docs scaffolding)."
          fi

      - name: Install uv
        if: steps.detect.outputs.has_mkdocs == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.detect.outputs.has_mkdocs == 'true'
        run: uv python install 3.10

      - name: Install operonx (for mkdocstrings imports)
        if: steps.detect.outputs.has_mkdocs == 'true'
        run: uv sync --all-extras

      - name: Install mkdocs
        if: steps.detect.outputs.has_mkdocs == 'true'
        run: uv pip install mkdocs-material "mkdocstrings[python]"

      - name: Build docs (strict)
        id: build
        if: steps.detect.outputs.has_mkdocs == 'true'
        run: |
          uv run mkdocs build --strict
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: |
          steps.detect.outputs.has_mkdocs == 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: |
      needs.build.outputs.built == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
