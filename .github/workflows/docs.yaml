name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'architecture/**'
      - 'tutorial/docs/**'
      - 'mkdocs.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Create symlinks for docs
        run: |
          ln -s ../architecture docs/architecture
          ln -s ../tutorial/docs docs/tutorial
          ln -s ../CONTRIBUTING.md docs/CONTRIBUTING.md
          ln -s ../assets docs/assets

      - name: Build and deploy
        run: mkdocs gh-deploy --force
