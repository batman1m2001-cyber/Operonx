name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Main test suite (single package, all extras) ────────────────────────
  test:
    name: pytest (operonx, all extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ --tb=short -q -m "not integration"

  # ── Extras smoke matrix — verifies pip install operonx[X] works ─────────
  extras-smoke:
    name: extras smoke (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every extra that can reach `operonx.providers`, plus the feature
        # extras. `huggingface` is omitted for the same reason `all` omits
        # it: torch is a 2GB download.
        #
        # This list was previously missing `openai` — the most-used extra —
        # and every retrieval extra, which is why v1.3.0 shipped with
        # `pip install operonx[openai]` unable to import operonx.providers.
        extra:
          - openai
          - anthropic
          - gemini
          - bedrock
          - onnx
          - faiss
          - pgvector
          - postgres
          - qdrant
          - providers
          - langfuse
          - serve
          - standard
          - all
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      # Build the wheel from this checkout, then install just that wheel
      # with the requested extra into a fresh venv. This catches missing
      # dependency declarations (e.g. forgetting to list `boto3` under
      # `[bedrock]`) before users discover them at install time.
      - name: Build wheel
        run: uv build --wheel

      - name: Install operonx[${{ matrix.extra }}] in fresh venv
        run: |
          uv venv /tmp/extras-venv
          uv pip install --python /tmp/extras-venv/bin/python \
            "$(ls dist/operonx-*.whl)[${{ matrix.extra }}]"

      - name: Verify import surface
        run: |
          /tmp/extras-venv/bin/python - <<'PY'
          import operonx
          print("operonx", operonx.__version__)
          # Each extra has at least one optional import path that must work
          # once installed. Anything below should NOT raise.
          extra = "${{ matrix.extra }}"

          # Any extra that pulls a provider must be able to import the
          # package those providers live in. The previous version checked
          # `onnxruntime` for the onnx extra but never imported
          # operonx.providers, so it passed while that import was broken.
          PROVIDER_EXTRAS = {
              "openai", "anthropic", "gemini", "bedrock", "onnx",
              "faiss", "pgvector", "postgres", "qdrant", "providers",
              "standard", "all",
          }
          if extra in PROVIDER_EXTRAS:
              import operonx.providers  # noqa: F401

          if extra == "anthropic":
              from operonx.providers.llms.anthropic import AnthropicModel  # noqa: F401
          elif extra in ("langfuse", "standard", "all"):
              from operonx.telemetry.consumers import LangfuseConsumer  # noqa: F401
          elif extra == "onnx":
              import onnxruntime  # noqa: F401
              import tokenizers  # noqa: F401
          elif extra == "serve":
              import fastapi  # noqa: F401
              import uvicorn  # noqa: F401

          if extra in ("openai", "standard", "all", "providers"):
              from operonx.providers.llms.openai import OpenAISDKModel  # noqa: F401
          if extra == "faiss":
              from operonx.providers.vector_stores import FaissVectorStore  # noqa: F401
          PY

  # ── Every tutorial example must actually build ──────────────────────────
  examples-build:
    name: examples build offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      # `ex16_rag_pipeline` shipped for months in a state where its graph
      # could not be constructed at all — `texts=[question]` puts a Ref
      # inside a list, which operonx rejects, and its own main.py triggers
      # it. Nothing exercised the examples, so nothing noticed.
      #
      # `--build` constructs every declared graph with the network blocked,
      # which also holds C2: construction must not reach a service.
      - name: Lint and build every example
        # The tooling lives in its own repo now (operonx-studio); this
        # fetch is also the cross-repo integration gate — extraction reads
        # operonx object internals across a subprocess seam, and this is
        # where a core change that breaks the IR contract fails first.
        run: |
          set -e
          uv pip install git+https://github.com/batman1m2001-cyber/operonx-studio
          failed=0
          for dir in examples/python/ex*/; do
            echo "── ${dir}"
              uv run python -m operonx_project.cli "${dir%/}" --build || failed=1
          done
          exit $failed

  # ── Coverage upload to Codecov ──────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest with coverage
        run: uv run pytest tests/ --cov=operonx --cov-report=xml -m "not integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
