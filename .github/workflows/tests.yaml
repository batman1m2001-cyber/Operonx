name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Main test suite (single package, all extras) ────────────────────────
  test:
    name: pytest (operonx, all extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest tests/ --tb=short -q -m "not integration"

  # ── Extras smoke matrix — verifies pip install operonx[X] works ─────────
  extras-smoke:
    name: extras smoke (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - anthropic
          - langfuse
          - onnx
          - serve
          - standard
          - all
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      # Build the wheel from this checkout, then install just that wheel
      # with the requested extra into a fresh venv. This catches missing
      # dependency declarations (e.g. forgetting to list `boto3` under
      # `[bedrock]`) before users discover them at install time.
      - name: Build wheel
        run: uv build --wheel

      - name: Install operonx[${{ matrix.extra }}] in fresh venv
        run: |
          uv venv /tmp/extras-venv
          uv pip install --python /tmp/extras-venv/bin/python \
            "$(ls dist/operonx-*.whl)[${{ matrix.extra }}]"

      - name: Verify import surface
        run: |
          /tmp/extras-venv/bin/python - <<'PY'
          import operonx
          print("operonx", operonx.__version__)
          # Each extra has at least one optional import path that must work
          # once installed. Anything below should NOT raise.
          extra = "${{ matrix.extra }}"
          if extra == "anthropic":
              from operonx.providers.llms.anthropic import AnthropicModel  # noqa: F401
          elif extra == "langfuse":
              from operonx.telemetry.consumers import LangfuseConsumer  # noqa: F401
          elif extra == "onnx":
              import onnxruntime  # noqa: F401
              import tokenizers  # noqa: F401
          elif extra == "serve":
              import fastapi  # noqa: F401
              import uvicorn  # noqa: F401
          elif extra in ("standard", "all"):
              from operonx.providers.llms.openai import OpenAISDKModel  # noqa: F401
              from operonx.telemetry.consumers import LangfuseConsumer  # noqa: F401
          PY

  # ── Coverage upload to Codecov ──────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest with coverage
        run: uv run pytest tests/ --cov=operonx --cov-report=xml -m "not integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
