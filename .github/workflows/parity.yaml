name: Python ↔ Rust Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'operon/**'
      - 'rust/**'
      - 'tests/spec/**'
  pull_request:
    branches: [main]
    paths:
      - 'operon/**'
      - 'rust/**'
      - 'tests/spec/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Run the shared spec fixtures through both runtimes. If a fixture
  #    passes on one side and fails on the other, parity is broken and the
  #    job fails.
  spec-fixtures:
    name: Run shared JSON fixtures (python + rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-parity-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Python — run spec fixtures
        run: uv run pytest tests/spec/test_fixtures.py -v

      - name: Rust — run spec_core
        working-directory: rust
        run: cargo test -p operonx --test spec_core

      - name: Rust — run spec_providers
        working-directory: rust
        run: cargo test -p operonx --test spec_providers

      - name: Rust — run spec_telemetry
        working-directory: rust
        run: cargo test -p operonx --test spec_telemetry

  # 2. Drift check (plan §8.11): each fixture folder must have both
  #    `graph.json` (→ Rust consumer) and `builder.py` (→ Python consumer).
  #    Fixtures with only one side present fail the build.
  fixture-coverage:
    name: Verify every fixture has both Python + Rust runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every spec/ folder has graph.json + builder.py
        run: |
          missing=0
          while IFS= read -r dir; do
            if [ ! -f "$dir/graph.json" ]; then
              echo "::error file=$dir::missing graph.json (Rust-side parity file)"
              missing=1
            fi
            if [ ! -f "$dir/builder.py" ]; then
              echo "::error file=$dir::missing builder.py (Python-side parity file)"
              missing=1
            fi
            if [ ! -f "$dir/inputs.json" ] || [ ! -f "$dir/expected.json" ]; then
              echo "::error file=$dir::missing inputs.json or expected.json"
              missing=1
            fi
          done < <(find tests/spec -type d -name '[a-z_]*' -exec test -e '{}/expected.json' \; -print 2>/dev/null | sort -u)
          # Second pass: list every directory that ships an expected.json;
          # that's the canonical fixture marker.
          while IFS= read -r exp; do
            dir=$(dirname "$exp")
            for f in graph.json inputs.json builder.py; do
              if [ ! -f "$dir/$f" ]; then
                echo "::error file=$dir::$f is missing — required for Python/Rust parity"
                missing=1
              fi
            done
          done < <(find tests/spec -name expected.json)
          exit "$missing"

      - name: Diff Rust spec/core/ test wiring against fixture tree
        run: |
          # Every fixture folder under tests/spec/core/ must have a
          # matching #[test] function somewhere in rust/operonx/tests/spec/core/.
          fixtures=$(find tests/spec/core -name expected.json -printf '%h\n' | sort -u | awk -F/ '{print $NF}')
          rust_tests=$(grep -rhoE 'fn [a-z_]+\(' rust/operonx/tests/spec/ | awk '{print $2}' | tr -d '(' | sort -u)
          missing=0
          for fx in $fixtures; do
            # Allow common helpers (strip_* etc.) to be missing from the fixture list.
            if ! echo "$rust_tests" | grep -qx "$fx"; then
              echo "::warning::fixture '$fx' has no Rust #[test] wiring"
            fi
          done
          exit "$missing"
