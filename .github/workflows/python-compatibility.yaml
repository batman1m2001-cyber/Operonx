name: Python Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "**/pyproject.toml"

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package:
          - python/hush-icore
          - python/hush-providers
          - python/hush-telemetry
          - python/hush-serve

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package
        working-directory: ${{ matrix.package }}
        run: uv sync --all-extras

      - name: Verify import
        working-directory: ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = "python/hush-icore" ]; then
            uv run python -c "from hush.core import GraphOp, FuncOp, START, END"
          elif [ "${{ matrix.package }}" = "python/hush-providers" ]; then
            uv run python -c "from hush.providers import LLMFactory, EmbeddingFactory"
          elif [ "${{ matrix.package }}" = "python/hush-telemetry" ]; then
            uv run python -c "from hush.telemetry import LangfuseTracer"
          elif [ "${{ matrix.package }}" = "python/hush-serve" ]; then
            uv run python -c "from hush.serve import HushApp"
          fi
