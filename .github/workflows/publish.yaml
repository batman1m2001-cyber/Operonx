name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even when the version is unchanged from HEAD~1 (use to recover when a version bump and a follow-up commit were pushed together)."
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── One job per distribution: detect its version bump, publish, tag ─────
  # operonx (repo root, tag vX.Y.Z) and the packages under packages/ (tag
  # <name>-vX.Y.Z). Each compares its own pyproject.toml with the previous
  # commit on main, so a bump in one never republishes the others.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: ".", tag_prefix: "v" }
          - { dir: "packages/operonx-agents", tag_prefix: "operonx-agents-v" }
          - { dir: "packages/operonx-kb", tag_prefix: "operonx-kb-v" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          FORCE: ${{ inputs.force }}
          DIR: ${{ matrix.dir }}
        run: |
          # Merge commit: HEAD^1 = previous main tip. Regular commit: HEAD~1.
          if git rev-parse HEAD^2 >/dev/null 2>&1; then BASE="HEAD^1"; else BASE="HEAD~1"; fi
          FILE="$DIR/pyproject.toml"; FILE="${FILE#./}"
          OLD=$(git show "$BASE:$FILE" 2>/dev/null | awk -F'"' '/^version *= */ {print $2; exit}' || true)
          NEW=$(awk -F'"' '/^version *= */ {print $2; exit}' "$FILE")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ] && { [ "$OLD" != "$NEW" ] || [ "$FORCE" = "true" ]; }; then
            echo "$FILE: '$OLD' -> '$NEW' (publish)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "$FILE: $NEW (unchanged)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.detect.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel + sdist
        if: steps.detect.outputs.changed == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          uv python install 3.10
          uv build --out-dir dist/

      - name: Publish to PyPI
        if: steps.detect.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.dir }}/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create git tag
        if: steps.detect.outputs.changed == 'true'
        env:
          TAG: ${{ matrix.tag_prefix }}${{ steps.detect.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
