name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  check-version:
    runs-on: ubuntu-latest
    outputs:
      python-changed: ${{ steps.check.outputs.python_changed }}
      rust-changed: ${{ steps.check.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          PYTHON_CHANGED="false"
          RUST_CHANGED="false"

          # Compare against the previous commit on main (before this merge)
          # For merge commits: use HEAD^1 (first parent = previous main tip)
          # For regular commits: use HEAD~1
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            BASE="HEAD^1"
          else
            BASE="HEAD~1"
          fi

          echo "Comparing against $BASE ($(git rev-parse --short $BASE))"

          for pkg in python/hush-icore python/hush-providers python/hush-telemetry python/hush-serve; do
            OLD=$(git show $BASE:$pkg/pyproject.toml 2>/dev/null | grep '^version' | head -1 || echo "")
            NEW=$(grep '^version' $pkg/pyproject.toml | head -1)
            if [ "$OLD" != "$NEW" ]; then
              echo "$pkg: $OLD -> $NEW (CHANGED)"
              PYTHON_CHANGED="true"
            fi
          done

          for crate in rust/hush-macros rust/hush-icore rust/hush-providers rust/hush-telemetry rust/hush-serve; do
            OLD=$(git show $BASE:$crate/Cargo.toml 2>/dev/null | grep '^version' | head -1 || echo "")
            NEW=$(grep '^version' $crate/Cargo.toml | head -1)
            if [ "$OLD" != "$NEW" ]; then
              echo "$crate: $OLD -> $NEW (CHANGED)"
              RUST_CHANGED="true"
            fi
          done

          echo "python_changed=$PYTHON_CHANGED" >> "$GITHUB_OUTPUT"
          echo "rust_changed=$RUST_CHANGED" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: [test, check-version]
    if: needs.check-version.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - package: hush-icore
            directory: python/hush-icore
          - package: hush-providers
            directory: python/hush-providers
          - package: hush-telemetry
            directory: python/hush-telemetry
          - package: hush-serve
            directory: python/hush-serve
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Build package
        working-directory: ${{ matrix.directory }}
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.directory }}/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-crates:
    needs: [test, check-version]
    if: needs.check-version.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-publish-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Order: macros first (standalone), then icore, then providers (depends on icore),
          # then telemetry (depends on icore), then serve (depends on all).
          cargo publish -p hush-macros
          sleep 30
          cargo publish -p hush-icore
          sleep 30
          cargo publish -p hush-providers
          sleep 30
          cargo publish -p hush-telemetry
          sleep 30
          cargo publish -p hush-serve
