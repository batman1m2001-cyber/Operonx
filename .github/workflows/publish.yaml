name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  check-version:
    runs-on: ubuntu-latest
    outputs:
      python-changed: ${{ steps.check.outputs.python_changed }}
      rust-changed: ${{ steps.check.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          PYTHON_CHANGED="false"
          RUST_CHANGED="false"

          for pkg in python/hush-core python/hush-providers python/hush-telemetry python/hush-serve; do
            OLD=$(git show HEAD~1:$pkg/pyproject.toml 2>/dev/null | grep '^version' | head -1 || echo "")
            NEW=$(grep '^version' $pkg/pyproject.toml | head -1)
            if [ "$OLD" != "$NEW" ]; then PYTHON_CHANGED="true"; fi
          done

          for crate in rust/rush-core rust/rush-providers rust/rush-telemetry rust/rush-serve rust/ui-hush-eyes; do
            OLD=$(git show HEAD~1:$crate/Cargo.toml 2>/dev/null | grep '^version' | head -1 || echo "")
            NEW=$(grep '^version' $crate/Cargo.toml | head -1)
            if [ "$OLD" != "$NEW" ]; then RUST_CHANGED="true"; fi
          done

          echo "python_changed=$PYTHON_CHANGED" >> "$GITHUB_OUTPUT"
          echo "rust_changed=$RUST_CHANGED" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: [test, check-version]
    if: needs.check-version.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        package: [hush-core, hush-providers, hush-telemetry, hush-serve]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Build package
        working-directory: python/${{ matrix.package }}
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/${{ matrix.package }}/dist/

  publish-crates:
    needs: [test, check-version]
    if: needs.check-version.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p rush-providers
          cargo publish -p rush-core
          cargo publish -p rush-telemetry
          cargo publish -p rush-serve
          cargo publish -p hush-eyes
