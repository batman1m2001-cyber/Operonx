name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even when versions are unchanged from HEAD~1 (use to recover when a version bump and a follow-up commit were pushed together)."
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detect a version bump on push to main ───────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.detect.outputs.python_version }}
      python-changed: ${{ steps.detect.outputs.python_changed }}
      rust-version: ${{ steps.detect.outputs.rust_version }}
      rust-changed: ${{ steps.detect.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        env:
          FORCE: ${{ inputs.force }}
        run: |
          # Compare against the previous commit on main (before this merge).
          # Merge commit: HEAD^1 = previous main tip. Regular commit: HEAD~1.
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            BASE="HEAD^1"
          else
            BASE="HEAD~1"
          fi
          echo "Comparing against $BASE ($(git rev-parse --short $BASE))"
          if [ "$FORCE" = "true" ]; then
            echo "force=true — bypassing version diff and publishing current versions."
          fi

          # Python — root pyproject.toml
          PY_OLD=$(git show $BASE:pyproject.toml 2>/dev/null | awk -F'"' '/^version *= */ {print $2; exit}' || true)
          PY_NEW=$(awk -F'"' '/^version *= */ {print $2; exit}' pyproject.toml)
          if { [ "$PY_OLD" != "$PY_NEW" ] || [ "$FORCE" = "true" ]; } && [ -n "$PY_NEW" ]; then
            if [ "$FORCE" = "true" ] && [ "$PY_OLD" = "$PY_NEW" ]; then
              echo "python: $PY_NEW (forced)"
            else
              echo "python: $PY_OLD -> $PY_NEW (CHANGED)"
            fi
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
            echo "python_version=$PY_NEW" >> "$GITHUB_OUTPUT"
          else
            echo "python: $PY_NEW (unchanged)"
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
            echo "python_version=$PY_NEW" >> "$GITHUB_OUTPUT"
          fi

          # Rust — workspace version (rust/Cargo.toml [workspace.package])
          RUST_OLD=$(git show $BASE:rust/Cargo.toml 2>/dev/null | awk -F'"' '/^version *= */ {print $2; exit}' || true)
          RUST_NEW=$(awk -F'"' '/^version *= */ {print $2; exit}' rust/Cargo.toml)
          if { [ "$RUST_OLD" != "$RUST_NEW" ] || [ "$FORCE" = "true" ]; } && [ -n "$RUST_NEW" ]; then
            if [ "$FORCE" = "true" ] && [ "$RUST_OLD" = "$RUST_NEW" ]; then
              echo "rust: $RUST_NEW (forced)"
            else
              echo "rust: $RUST_OLD -> $RUST_NEW (CHANGED)"
            fi
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            echo "rust_version=$RUST_NEW" >> "$GITHUB_OUTPUT"
          else
            echo "rust: $RUST_NEW (unchanged)"
            echo "rust_changed=false" >> "$GITHUB_OUTPUT"
            echo "rust_version=$RUST_NEW" >> "$GITHUB_OUTPUT"
          fi

  # ── Publish to PyPI ─────────────────────────────────────────────────────
  publish-pypi:
    needs: check-version
    if: needs.check-version.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ── Publish to crates.io ────────────────────────────────────────────────
  # Two crates, sequential: macros has no deps, operonx depends on macros.
  publish-crates:
    needs: check-version
    if: needs.check-version.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-publish-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Order: macros first (no operonx deps), then the main crate.
          cargo publish -p operonx-macros
          # Wait for the index to update before publishing the dependent.
          sleep 30
          cargo publish -p operonx

  # ── Tag the release ─────────────────────────────────────────────────────
  # Runs after both publish jobs (PyPI + crates) complete. Skips silently
  # when neither published anything. Uses the Python version as canonical
  # because that's what most users see (`pip install operonx==X.Y.Z`).
  tag-release:
    needs: [check-version, publish-pypi, publish-crates]
    if: always() && (needs.publish-pypi.result == 'success' || needs.publish-crates.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create git tag
        env:
          VERSION: ${{ needs.check-version.outputs.python-version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "No version detected; skipping tag."
            exit 0
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
