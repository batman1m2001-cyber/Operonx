name: Question
description: Ask a question about Hush
labels: ["question"]

body:
  - type: markdown
    attributes:
      value: |
        Have a question about using Hush? We're happy to help!

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant context (what you're trying to achieve, code snippets, etc.)

  - type: checkboxes
    id: docs
    attributes:
      label: Documentation Check
      options:
        - label: I have checked the existing documentation in hush-tutorial/docs/
