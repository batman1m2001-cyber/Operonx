<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}.card{fill:#ffffff;stroke:#d0d7de}.surf{fill:#f6f8fa;stroke:#d0d7de}
    .ink{fill:#1f2328}.mut{fill:#59636e}.rule{stroke:#d0d7de}
    .core{fill:#1a7f37}.data{fill:#9a6700}.bad{fill:#d1242f}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.surf{fill:#0d1117;stroke:#30363d}
      .ink{fill:#e6edf3}.mut{fill:#9198a1}.rule{stroke:#30363d}
      .core{fill:#3fb950}.data{fill:#d29922}.bad{fill:#f85149}
    }
  </style>
  <rect class="bg" width="960" height="330" rx="12"/>
  <text x="24" y="34" class="ink" font-size="18" font-weight="600">Three kinds of card</text>
  <text x="24" y="54" class="mut" font-size="13">Same fields on all three. The kind says how the card gets built.</text>

  <!-- unit -->
  <g transform="translate(24,72)">
    <rect class="card" width="292" height="178" rx="8"/>
    <rect class="core" x="0" y="0" width="6" height="178" rx="3"/>
    <text x="18" y="28" class="ink" font-size="14"><tspan font-weight="700">C4</tspan>  threshold rule</text>
    <rect class="surf" x="188" y="13" width="92" height="22" rx="11"/>
    <text x="234" y="28" class="ink" font-size="11.5" text-anchor="middle">unit · rule</text>
    <line class="rule" x1="12" x2="280" y1="44" y2="44"/>
    <g font-size="12">
      <text x="18" y="66" class="mut">lane</text><text x="70" y="66" class="ink">core</text>
      <text x="18" y="86" class="mut">req</text><text x="70" y="86" class="ink">NEWS-07 · after C2</text>
      <text x="18" y="106" class="mut">files</text><text x="70" y="106" class="ink mono" font-size="11.5">src/news/threshold.py</text>
      <text x="70" y="124" class="ink mono" font-size="11.5">tests/news/test_threshold.py</text>
      <text x="18" y="144" class="mut">done</text><text x="70" y="144" class="ink">test_gold_jump + project tests</text>
    </g>
  </g>

  <!-- flexible -->
  <g transform="translate(334,72)">
    <rect class="card" width="292" height="178" rx="8"/>
    <rect class="core" x="0" y="0" width="6" height="178" rx="3"/>
    <text x="18" y="28" class="ink" font-size="14"><tspan font-weight="700">C3</tspan>  daily move</text>
    <rect class="surf" x="188" y="13" width="92" height="22" rx="11"/>
    <text x="234" y="28" class="ink" font-size="11.5" text-anchor="middle">flexible</text>
    <line class="rule" x1="12" x2="280" y1="44" y2="44"/>
    <g font-size="12">
      <text x="18" y="66" class="mut">lane</text><text x="70" y="66" class="ink">core</text>
      <text x="18" y="86" class="mut">req</text><text x="70" y="86" class="ink">NEWS-07 · after C2</text>
      <text x="18" y="106" class="mut">design</text><text x="70" y="106" class="ink">% change of two closes;</text>
      <text x="70" y="124" class="ink">a missing day is skipped</text>
      <text x="18" y="144" class="mut">done</text><text x="70" y="144" class="ink">test_two_days + your review</text>
    </g>
  </g>

  <!-- fix -->
  <g transform="translate(644,72)">
    <rect class="card" width="292" height="178" rx="8"/>
    <rect class="data" x="0" y="0" width="6" height="178" rx="3"/>
    <text x="18" y="28" class="ink" font-size="14"><tspan font-weight="700">F1</tspan>  inbox drops old items</text>
    <rect class="surf" x="214" y="13" width="66" height="22" rx="11"/>
    <text x="247" y="28" class="ink" font-size="11.5" text-anchor="middle">fix</text>
    <line class="rule" x1="12" x2="280" y1="44" y2="44"/>
    <g font-size="12">
      <text x="18" y="66" class="mut">lane</text><text x="70" y="66" class="ink">data</text>
      <text x="18" y="86" class="mut">req</text><text x="70" y="86" class="ink">NEWS-03</text>
      <text x="18" y="106" class="mut">red</text><circle class="bad" cx="75" cy="102" r="4"/><text x="86" y="106" class="ink mono" font-size="11.5">test_keeps_old</text>
      <text x="70" y="124" class="mut">from failing_on_base or you</text>
      <text x="18" y="144" class="mut">done</text><text x="70" y="144" class="ink">the red test green</text>
    </g>
  </g>

  <!-- how each is built -->
  <g transform="translate(24,264)">
    <text class="ink" font-size="13" font-weight="600">Unit: a template fits</text>
    <text y="20" class="mut" font-size="12"><tspan class="mono" font-size="11.5">operonx add rule news threshold</tspan></text>
    <text y="38" class="mut" font-size="12">stamps the file and a red test; fill the body</text>
  </g>
  <g transform="translate(334,264)">
    <text class="ink" font-size="13" font-weight="600">Flexible: no unit fits</text>
    <text y="20" class="mut" font-size="12">a 3-line design on the card, then code + test</text>
    <text y="38" class="mut" font-size="12">ends in needs you: you review the diff</text>
  </g>
  <g transform="translate(644,264)">
    <text class="ink" font-size="13" font-weight="600">Fix: something is broken</text>
    <text y="20" class="mut" font-size="12">the red test comes first</text>
    <text y="38" class="mut" font-size="12">and it is the card's done test</text>
  </g>
</svg>
