<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}.grp{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}
    .ink{fill:#1f2328}.mut{fill:#59636e}.arrow{stroke:#0969da;stroke-width:1.6;fill:none}.head{fill:#0969da}
    .run{stroke:#0969da;stroke-width:2;fill:#ffffff}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1117}.grp{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}
      .ink{fill:#e6edf3}.mut{fill:#9198a1}.arrow{stroke:#4493f8}.head{fill:#4493f8}
      .run{stroke:#4493f8;fill:#161b22}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="1180" height="640" rx="12"/>
  <text x="24" y="36" class="ink" font-size="18" font-weight="600">Architecture</text>
  <text x="24" y="56" class="mut" font-size="13">Two files hold the state. The assistant is the only writer; the studio only reads and shows.</text>

  <!-- studio page -->
  <rect class="grp" x="24" y="72" width="1132" height="150" rx="10"/>
  <text x="40" y="96" class="ink" font-size="13" font-weight="600">Studio · project page</text>
  <g transform="translate(44,108)">
    <rect class="card" width="372" height="96" rx="8"/>
    <text x="16" y="28" class="ink" font-size="14" font-weight="600">Chat</text>
    <text x="16" y="52" class="mut" font-size="12.5">a task in, the cards proposed,</text>
    <text x="16" y="70" class="mut" font-size="12.5">"go", answers to needs-you cards</text>
  </g>
  <g transform="translate(436,108)">
    <rect class="run" width="700" height="96" rx="8"/>
    <text x="16" y="28" class="ink" font-size="14" font-weight="600">Board</text>
    <text x="16" y="52" class="mut" font-size="12.5">lanes × status · the running card highlighted · its live progress line</text>
    <text x="16" y="70" class="mut" font-size="12.5">read-only: cards move only when the assistant moves them</text>
  </g>

  <!-- assistant turn -->
  <rect class="grp" x="24" y="282" width="1132" height="110" rx="10"/>
  <text x="40" y="306" class="ink" font-size="13" font-weight="600">Assistant · one Claude Code turn</text>
  <g transform="translate(44,318)">
    <rect class="card" width="340" height="58" rx="8"/>
    <text x="16" y="24" class="ink" font-size="13.5" font-weight="600">MCP tools</text>
    <text x="16" y="44" class="mut mono" font-size="11.5">card_add · card_set · units</text>
  </g>
  <g transform="translate(404,318)">
    <rect class="card" width="330" height="58" rx="8"/>
    <text x="16" y="24" class="ink" font-size="13.5" font-weight="600">Stop hook</text>
    <text x="16" y="44" class="mut" font-size="12">refuses a turn that leaves a card doing</text>
  </g>
  <g transform="translate(774,318)">
    <rect class="card" width="362" height="58" rx="8"/>
    <text x="16" y="24" class="ink" font-size="13.5" font-weight="600">Shell, through runhook</text>
    <text x="16" y="44" class="mut mono" font-size="11.5">operonx add · edits · pytest</text>
  </g>

  <!-- bottom row -->
  <g transform="translate(24,452)">
    <rect class="grp" width="400" height="126" rx="10"/>
    <text x="16" y="24" class="ink" font-size="13" font-weight="600">Project repo</text>
    <text x="16" y="50" class="ink mono" font-size="11.5">docs/brd/requirements.md</text><text x="230" y="50" class="mut" font-size="12">what and why</text>
    <text x="16" y="72" class="ink mono" font-size="11.5">docs/brd/board.md</text><text x="230" y="72" class="mut" font-size="12">the cards</text>
    <text x="16" y="94" class="ink mono" font-size="11.5">src/ · web/ · tests/</text><text x="230" y="94" class="mut" font-size="12">the code</text>
  </g>
  <g transform="translate(484,452)">
    <rect class="grp" width="320" height="126" rx="10"/>
    <text x="16" y="24" class="ink" font-size="13" font-weight="600">Studio server</text>
    <text x="16" y="50" class="mut" font-size="12">watches board.md, pushes the board</text>
    <text x="16" y="72" class="mut" font-size="12"><tspan class="ink mono" font-size="11.5">progress.py</tspan> reads the running call:</text>
    <text x="16" y="94" class="mut" font-size="12">n / total, last line, its age</text>
  </g>
  <g transform="translate(864,452)">
    <rect class="grp" width="292" height="126" rx="10"/>
    <text x="16" y="24" class="ink" font-size="13" font-weight="600">operonx</text>
    <text x="16" y="50" class="ink mono" font-size="11.5">_units/</text><text x="80" y="50" class="mut" font-size="12">10 templates, each with a test</text>
    <text x="16" y="72" class="ink mono" font-size="11.5">operonx add &lt;unit&gt; &lt;feature&gt; &lt;name&gt;</text>
    <text x="16" y="94" class="mut" font-size="12">stamps a stub and its red test</text>
  </g>

  <!-- arrows -->
  <path class="arrow" d="M230,204 V280" marker-end="url(#a)"/>
  <text x="240" y="248" class="mut" font-size="11.5">task · go · answers</text>

  <path class="arrow" d="M214,376 V450" marker-end="url(#a)"/>
  <text x="224" y="418" class="mut" font-size="11.5">writes cards</text>

  <path class="arrow" d="M424,515 H482" marker-end="url(#a)"/>
  <text x="453" y="507" class="mut" font-size="11" text-anchor="middle">board.md</text>

  <path class="arrow" d="M754,450 V206" marker-end="url(#a)"/>
  <text x="746" y="248" class="mut" font-size="11.5" text-anchor="end">board + progress, live</text>

  <path class="arrow" d="M790,376 V450" marker-end="url(#a)"/>
  <text x="800" y="418" class="mut" font-size="11.5">the call's output</text>

  <path class="arrow" d="M1010,376 V450" marker-end="url(#a)"/>
  <text x="1020" y="418" class="mut" font-size="11.5">operonx add</text>

  <path class="arrow" d="M1010,578 V604 H224 V580" marker-end="url(#a)"/>
  <text x="617" y="624" class="mut" font-size="11.5" text-anchor="middle">stamps the unit's files and its red test into src/ and tests/</text>
</svg>
