site_name: Hush
site_description: High-performance workflow engine that runs anything as a workflow
repo_url: https://github.com/batman1m2001-cyber/Hush-ai
docs_dir: .

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../python/hush-icore
            - ../python/hush-providers
            - ../python/hush-telemetry
            - ../python/hush-serve
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guide:
    - Overview: guide/00-tong-quan.md
    - Installation: guide/01-cai-dat-va-thiet-lap.md
    - Quickstart: guide/02-quickstart.md
    - Core Concepts: guide/03-core-concepts.md
    - LLM Integration: guide/04-llm-integration.md
    - Loops & Branches: guide/05-loops-branches.md
    - Embeddings & RAG: guide/06-embeddings-rag.md
    - Error Handling: guide/07-error-handling.md
    - Parallel Execution: guide/08-parallel-execution.md
    - Tracing: guide/09-tracing-observability.md
    - Agent Workflow: guide/10-agent-workflow.md
    - Multi-Model: guide/11-multi-model.md
    - Shorthand Syntax: guide/12-shorthand-syntax.md
    - Rust Mode: guide/13-rust-mode-va-plugin.md
  - API Reference:
    - Engine: api/engine.md
    - Ops: api/ops.md
    - State: api/state.md
    - Middleware: api/middleware.md
    - Providers: api/providers.md
    - Telemetry: api/telemetry.md
    - Serve: api/serve.md
  - Architecture:
    - Execution Flow: architecture/execution-flow.md
    - State Model: architecture/state-model.md
    - Streaming: architecture/streaming.md
    - Rust-Python Split: architecture/rust-python-split.md
