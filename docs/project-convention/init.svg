<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#ffffff}.grp{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}
    .ink{fill:#1f2328}.mut{fill:#59636e}.rule{stroke:#d0d7de}
    .ui{fill:#8250df}.web{fill:#0969da}.core{fill:#1a7f37}.data{fill:#9a6700}.ai{fill:#bf3989}.plat{fill:#6e7781}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1117}.grp{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}
      .ink{fill:#e6edf3}.mut{fill:#9198a1}.rule{stroke:#30363d}
      .ui{fill:#a371f7}.web{fill:#4493f8}.core{fill:#3fb950}.data{fill:#d29922}.ai{fill:#db61a2}.plat{fill:#8b949e}
    }
  </style>
  <rect class="bg" width="960" height="612" rx="12"/>
  <text x="24" y="34" class="ink" font-size="18" font-weight="600">operonx init: a base, plus the parts you ask for</text>
  <text x="24" y="54" class="mut" font-size="13">A part that is off leaves nothing behind: no file, no folder, no key in .env.example, no dependency.</text>
  <rect class="grp" x="24" y="96" width="300" height="360" rx="8"/>
  <rect class="core" x="24" y="96" width="5" height="360" rx="2.5"/>
  <text x="42" y="120" class="ink" font-size="14" font-weight="700">base</text>
  <text x="310" y="120" class="mut" font-size="12" text-anchor="end">always</text>
  <text x="42" y="148" class="ink mono" font-size="12">app/main.py</text>
  <text x="42" y="172" class="ink mono" font-size="12">src/_shared/config.py</text>
  <text x="42" y="196" class="ink mono" font-size="12">src/&lt;feature&gt;/</text>
  <text x="42" y="211" class="mut" font-size="11.5">__init__ · graph · ops · rules</text>
  <text x="42" y="232" class="ink mono" font-size="12">tests/&lt;feature&gt;/</text>
  <text x="42" y="247" class="mut" font-size="11.5">test_rules.py</text>
  <text x="42" y="268" class="ink mono" font-size="12">operonx.toml</text>
  <text x="42" y="283" class="mut" font-size="11.5">parts = [ … ]</text>
  <text x="42" y="304" class="ink mono" font-size="12">resources.yaml · .env.example</text>
  <text x="42" y="328" class="ink mono" font-size="12">pyproject · .gitignore</text>
  <text x="42" y="343" class="mut" font-size="11.5">ignores data/, out/</text>
  <text x="42" y="364" class="ink mono" font-size="12">AGENTS.md</text>
  <text x="42" y="379" class="mut" font-size="11.5">lists only the parts on</text>
  <text x="42" y="400" class="ink mono" font-size="12">docs/brd/</text>
  <text x="42" y="415" class="mut" font-size="11.5">off with --no-brd</text>
  <text x="42" y="442" class="mut" font-size="12">runs offline: <tspan class="ink mono" font-size="11.5">operonx run</tspan>, no server, no key</text>
  <text x="348" y="90" class="mut" font-size="11.5" font-weight="600" letter-spacing=".4">PARTS · EACH ONE A FLAG</text>
  <g transform="translate(348,104)"><rect class="card" width="288" height="72" rx="8"/><rect class="web" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--http</text><text x="16" y="44" class="ink" font-size="12">routes.py · SERVICES in main.py</text><text x="16" y="61" class="mut" font-size="11.5">dep: operonx[serve]</text></g>
  <g transform="translate(648,104)"><rect class="card" width="288" height="72" rx="8"/><rect class="ui" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--web</text><text x="276" y="24" class="mut" font-size="11.5" text-anchor="end">needs --http</text><text x="16" y="44" class="ink" font-size="12">web/ as in §4</text><text x="16" y="61" class="mut" font-size="11.5">the static mount in main.py</text></g>
  <g transform="translate(348,188)"><rect class="card" width="288" height="72" rx="8"/><rect class="web" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--jobs</text><text x="16" y="44" class="ink" font-size="12">jobs.py · JOBS in main.py</text><text x="16" y="61" class="mut" font-size="11.5">datasets/sample.jsonl</text></g>
  <g transform="translate(648,188)"><rect class="card" width="288" height="72" rx="8"/><rect class="data" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--store</text><text x="16" y="44" class="ink" font-size="12">store.py · src/_shared/db.py</text><text x="16" y="61" class="mut" font-size="11.5">data/seed/</text></g>
  <g transform="translate(348,272)"><rect class="card" width="288" height="72" rx="8"/><rect class="ai" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--llm</text><text x="16" y="44" class="ink" font-size="12">prompts.py · an LLMOp in ops.py</text><text x="16" y="61" class="mut" font-size="11.5">llm:assistant · LLM_API_KEY · dep: openai</text></g>
  <g transform="translate(648,272)"><rect class="card" width="288" height="72" rx="8"/><rect class="ai" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--agent</text><text x="276" y="24" class="mut" font-size="11.5" text-anchor="end">needs --llm</text><text x="16" y="44" class="ink" font-size="12">agent.py: AgentOp + one tool</text><text x="16" y="61" class="mut" font-size="11.5">dep: operonx-agents</text></g>
  <g transform="translate(348,356)"><rect class="card" width="288" height="72" rx="8"/><rect class="plat" width="5" height="72" rx="2.5"/><text x="16" y="24" class="ink mono" font-size="13" font-weight="700">--deploy</text><text x="16" y="44" class="ink" font-size="12">deploy/Dockerfile · compose.yml</text><text x="16" y="61" class="mut" font-size="11.5">serves if --http, else runs the job</text></g>
  <g transform="translate(648,356)"><rect class="grp" width="288" height="72" rx="8" stroke-dasharray="4 4"/><text x="16" y="24" class="ink" font-size="12.5" font-weight="600">a part later</text><text x="16" y="44" class="ink mono" font-size="12">operonx init . --web</text><text x="16" y="61" class="mut" font-size="11.5">adds only the missing files</text></g>
  <line class="rule" x1="24" x2="936" y1="468" y2="468"/>
  <text x="24" y="488" class="mut" font-size="11.5" font-weight="600" letter-spacing=".4">THE FOUR TEMPLATES STAY, AS NAMES FOR PARTS</text>
  <g transform="translate(24,500)"><rect class="card" width="216" height="34" rx="6"/><text x="12" y="22" class="ink mono" font-size="12" font-weight="700">hello</text><text x="204" y="22" class="mut mono" font-size="11.5" text-anchor="end">= --jobs --http</text></g>
  <g transform="translate(252,500)"><rect class="card" width="216" height="34" rx="6"/><text x="12" y="22" class="ink mono" font-size="12" font-weight="700">http</text><text x="204" y="22" class="mut mono" font-size="11.5" text-anchor="end">= --http</text></g>
  <g transform="translate(480,500)"><rect class="card" width="216" height="34" rx="6"/><text x="12" y="22" class="ink mono" font-size="12" font-weight="700">chat</text><text x="204" y="22" class="mut mono" font-size="11.5" text-anchor="end">= --http --llm</text></g>
  <g transform="translate(708,500)"><rect class="card" width="216" height="34" rx="6"/><text x="12" y="22" class="ink mono" font-size="12" font-weight="700">agent</text><text x="204" y="22" class="mut mono" font-size="11.5" text-anchor="end">= --http --agent</text></g>
  <line class="rule" x1="24" x2="936" y1="552" y2="552"/>
  <text x="24" y="576" class="mut" font-size="12.5"><tspan class="ink mono" font-size="12">operonx init pricing</tspan> → the base only   ·   <tspan class="ink mono" font-size="12">operonx init shop --web --store</tspan> → base + http + web + store</text>
  <text x="24" y="598" class="mut" font-size="12.5">Today: each template is one fixed set of files; all four install the HTTP server; an agent without HTTP, or chat + jobs, is not possible.</text>
</svg>
