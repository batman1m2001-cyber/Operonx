site_name: Operonx
site_description: A high-performance async workflow engine for AI applications
site_url: https://batman1m2001-cyber.github.io/Operonx/
repo_url: https://github.com/batman1m2001-cyber/Operonx
repo_name: batman1m2001-cyber/Operonx
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            # Docstring extraction
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            # Headings + signatures
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            heading_level: 2
            # Member rendering
            members_order: source
            group_by_category: true
            show_category_heading: true
            inherited_members: false
            show_if_no_docstring: false
            filters: ["!^_"]
            # Source links — keep them, but collapsible
            show_source: true
            show_bases: true
            # Cross-references
            show_root_toc_entry: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Guide:
      - Installation: guide/00-installation.md
      - Patterns: guide/00b-patterns.md
      - First workflow: guide/01-first-workflow.md
      - LLM chat: guide/02-llm-chat.md
      - Loops and branches: guide/03-loops-and-branches.md
      - RAG: guide/04-rag.md
      - Agents: guide/05-agents.md
      - Streaming: guide/06-streaming.md
      - Tracing: guide/07-tracing.md
      - Deployment: guide/08-deployment.md
      - Learning loop: guide/09-learning-loop.md
  - Architecture:
      - Overview: architecture/overview.md
      - Core map: architecture/core-map.md
      - Execution flow: architecture/execution-flow.md
      - State model: architecture/state-model.md
      - Streaming: architecture/streaming.md
      - Observability: architecture/observability.md
      - Resource hub: architecture/resource-hub.md
      - Failure modes: architecture/failure-modes.md
  - Open findings: design/OPEN_FINDINGS.md
  - Handoff: HANDOFF.md
  - API reference:
      - operonx.core: api/core.md
      - operonx.core.ops: api/ops.md
      - operonx.providers: api/providers.md
      - operonx.telemetry: api/telemetry.md
      - operonx.core.registry: api/registry.md

# Mermaid loader — Material renders any <pre class="mermaid"> block
# (produced by the pymdownx.superfences custom fence above) once this
# script is present.
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js
