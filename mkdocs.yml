site_name: Hush
site_description: High-Performance Workflow Engine for AI
site_url: https://batman1m2001-cyber.github.io/Hush-ai/
repo_url: https://github.com/batman1m2001-cyber/Hush-ai
repo_name: batman1m2001-cyber/Hush-ai

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/logo.png

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
      - Overview: tutorial/00-tong-quan.md
      - Installation: tutorial/01-cai-dat-va-thiet-lap.md
      - Quick Start: tutorial/02-quickstart.md
  - User Guide:
      - Core Concepts: tutorial/03-core-concepts.md
      - LLM Integration: tutorial/04-llm-integration.md
      - Loops & Branches: tutorial/05-loops-branches.md
      - Embeddings & RAG: tutorial/06-embeddings-rag.md
      - Error Handling: tutorial/07-error-handling.md
      - Parallel Execution: tutorial/08-parallel-execution.md
      - Tracing & Observability: tutorial/09-tracing-observability.md
      - Agent Workflows: tutorial/10-agent-workflow.md
      - Multi-Model: tutorial/11-multi-model.md
      - Shorthand Syntax: tutorial/12-shorthand-syntax.md
  - Architecture:
      - Overview: architecture/index.md
      - Engine:
          - Execution Flow: architecture/engine/execution-flow.md
          - Compilation: architecture/engine/compilation.md
          - Scheduling: architecture/engine/scheduling.md
      - State:
          - Overview: architecture/state/overview.md
          - StateSchema: architecture/state/state-schema.md
          - MemoryState: architecture/state/memory-state.md
          - Data Flow: architecture/state/data-flow.md
          - Indexer: architecture/state/indexer.md
      - Nodes:
          - Base Node: architecture/nodes/base-node.md
          - Graph Node: architecture/nodes/graph-node.md
          - Branch Node: architecture/nodes/branch-node.md
          - Iteration Nodes: architecture/nodes/iteration-nodes.md
          - Creating Custom Nodes: architecture/nodes/creating-custom-node.md
      - Providers:
          - LLM Abstraction: architecture/providers/llm-abstraction.md
          - Embedding Provider: architecture/providers/embedding-provider.md
          - Reranker Provider: architecture/providers/reranker-provider.md
          - Adding New Provider: architecture/providers/adding-new-provider.md
      - Resources:
          - Resource Hub: architecture/resources/resource-hub.md
          - Config Loading: architecture/resources/config-loading.md
          - Plugin System: architecture/resources/plugin-system.md
      - Tracing:
          - Trace Data Model: architecture/tracing/trace-data-model.md
          - Tracer Interface: architecture/tracing/tracer-interface.md
          - Local Tracer: architecture/tracing/local-tracer.md
          - Async Buffer: architecture/tracing/async-buffer.md
  - Contributing:
      - Guide: CONTRIBUTING.md
      - Development Setup: architecture/contributing/development-setup.md
      - Code Style: architecture/contributing/code-style.md
      - Testing: architecture/contributing/testing.md
      - Release Process: architecture/contributing/release-process.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
