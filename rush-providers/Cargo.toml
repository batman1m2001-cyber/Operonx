[package]
name = "rush-providers"
version = "0.1.0"
edition = "2021"
description = "Provider configs and native op implementations for the Hush workflow engine"

[lib]
name = "rush_providers"

[dependencies]
pyo3 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
rand = "0.8"
jsonwebtoken = "9"
base64 = "0.22"
ort = { version = "2.0.0-rc.9", features = ["ndarray"] }
ndarray = "0.16"
tokenizers = "0.20"

[dev-dependencies]
tempfile = "3"
