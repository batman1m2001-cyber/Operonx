# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true   # report-only for now; flip to false once test suite stabilizes
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "tests/"
  - "examples/"
  - "operonx/__init__.py"
