[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush-benchmarks"
version = "0.1.0"
description = "End-to-end benchmarks: Python backend vs Rust backend"
requires-python = ">=3.10"
dependencies = [
    "hush-icore>=0.1.0",
]

[tool.uv.sources]
hush-icore = { path = "../python/hush-icore", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]
