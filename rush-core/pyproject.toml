[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rush-core"
version = "0.1.0"
description = "High-performance Rust executor for the Hush workflow engine (Rust + Hush = Rush)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bench = ["hush-core"]

[tool.hatch.build.targets.wheel]
packages = ["python/rush_core"]

[tool.uv.sources]
hush-core = { path = "../hush-core", editable = true }
