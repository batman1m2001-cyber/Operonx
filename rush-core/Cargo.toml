[package]
name = "rush-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust executor for the Hush workflow engine (Rust + Hush = Rush)"

[lib]
name = "rush_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
ahash = "0.8"
smallvec = "1"
rayon = "1.10"
dashmap = "6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
