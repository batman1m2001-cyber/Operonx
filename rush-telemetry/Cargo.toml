[package]
name = "rush-telemetry"
version = "0.1.0"
edition = "2021"
description = "Tracing backends for rush-core (Langfuse, OTEL, HushEyes)"

[lib]
name = "rush_telemetry"

[dependencies]
rush-core = { path = "../rush-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# OTEL (optional)
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "http-proto"], optional = true }

[features]
default = []
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]
