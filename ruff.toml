# Monorepo-wide ruff baseline.
# Each Python package extends this via:
#   [tool.ruff]
#   extend = "../../ruff.toml"
# Package-specific overrides go under [tool.ruff.lint] extend-ignore = [...].

line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # Line too long — enforced by formatter, not linter
    "E402",  # Module-level import not at top (needed for load_dotenv pattern)
    "E721",  # Type comparison — intentional in some places
    "E722",  # Bare except
    "E731",  # Lambda assignment
    "F841",  # Unused local variable
]
