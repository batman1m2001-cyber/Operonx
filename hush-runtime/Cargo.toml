[package]
name = "hush-runtime"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust backend for the Hush workflow engine"

[lib]
name = "hush_runtime"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
ahash = "0.8"
smallvec = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
